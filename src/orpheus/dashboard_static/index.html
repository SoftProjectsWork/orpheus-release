<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruscotto ORPHEUS</title>
<link rel="stylesheet" href="/static/app.css">

<body data-token="__ORPHEUS_TOKEN__" data-version="__ORPHEUS_VERSION__" data-dev="__ORPHEUS_DEV__">
<a class="skip" href="#main" data-i18n="Vai al contenuto">Vai al contenuto</a>
<div class="bg-art" aria-hidden="true"></div>
<div class="shell">
  <nav class="side" aria-label="Sezioni del cruscotto" data-i18n-aria="Sezioni del cruscotto">
    <div class="brand">
      <svg class="brand-mark" id="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path class="mark-o" d="M8 6.5C11.9 6.5 13.5 10.1 13.1 13.6C12.8 16.4 11 18.9 7.5 20M24 6.5C20.1 6.5 18.5 10.1 18.9 13.6C19.2 16.4 21 18.9 24.5 20M7.5 20H24.5M16 20V26.5"/><g class="mark-e"><circle cx="16" cy="11" r="5.6"/><path d="M10.4 11H21.6M16 16.6V27M11.5 22H20.5"/></g></svg>
      <div><p class="brand-name" id="brand-name">ORPHEUS</p><p class="brand-sub" id="brand-sub"></p></div>
    </div>
    <div class="modsel" role="group" aria-label="Modulo" data-i18n-aria="Modulo">
      <button type="button" data-module-set="orpheus" aria-pressed="true">ORPHEUS</button>
      <button type="button" data-module-set="eurydike" aria-pressed="false">EURYDIKE</button>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      <div id="lavora-badge" class="lavora-badge" hidden></div>
      <button type="button" class="btn small settings-btn" id="settings-btn" aria-expanded="false" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-i18n="Impostazioni">Impostazioni</span>
      </button>
      <div class="settings-panel" id="settings-panel" role="region" aria-label="Impostazioni" data-i18n-aria="Impostazioni" hidden>
        <p class="set-label" data-i18n="Tema">Tema</p>
        <div class="theme" role="group" aria-label="Tema" data-i18n-aria="Tema">
          <button type="button" data-theme-set="light" aria-pressed="false" data-i18n="Chiaro">Chiaro</button>
          <button type="button" data-theme-set="dark" aria-pressed="false" data-i18n="Scuro">Scuro</button>
        </div>
        <p class="set-label" data-i18n="Lingua">Lingua</p>
        <div class="theme lang" role="group" aria-label="Lingua" data-i18n-aria="Lingua">
          <button type="button" data-lang-set="it" aria-pressed="true" lang="it">IT</button>
          <button type="button" data-lang-set="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <label class="stylesel"><span data-i18n="Stile">Stile</span>
          <select id="style-set">
            <option value="classico" data-i18n="Classico">Classico</option>
            <option value="moderno" data-i18n="Moderno">Moderno</option>
            <option value="industriale" data-i18n="Industriale">Industriale</option>
            <option value="oceano" data-i18n="Oceano">Oceano</option>
            <option value="terra" data-i18n="Terra">Terra</option>
          </select>
        </label>
        <p class="set-label" data-i18n="Dimensione">Dimensione</p>
        <div class="theme scale" role="group" aria-label="Dimensione" data-i18n-aria="Dimensione">
          <button type="button" data-scale-set="auto" aria-pressed="true" data-i18n="Auto">Auto</button>
          <button type="button" data-scale-set="0.9" aria-pressed="false">90%</button>
          <button type="button" data-scale-set="1" aria-pressed="false">100%</button>
          <button type="button" data-scale-set="1.1" aria-pressed="false">110%</button>
          <button type="button" data-scale-set="1.25" aria-pressed="false">125%</button>
        </div>
        <p class="set-label" data-i18n="Contrasto">Contrasto</p>
        <div class="theme" role="group" aria-label="Contrasto" data-i18n-aria="Contrasto">
          <button type="button" data-contrast-set="normale" aria-pressed="true" data-i18n="Normale">Normale</button>
          <button type="button" data-contrast-set="alto" aria-pressed="false" data-i18n="Alto">Alto</button>
        </div>
        <div class="row">
          <button type="button" class="btn small" id="style-new" data-i18n="Crea uno stile">Crea uno stile</button>
          <button type="button" class="btn small" id="style-edit" hidden data-i18n="Modifica questo stile">Modifica questo stile</button>
        </div>
        <button type="button" class="btn small text-edit-btn" id="layout-edit" aria-pressed="false" data-i18n="Personalizza i blocchi">Personalizza i blocchi</button>
        <button type="button" class="btn small text-edit-btn dev-only" id="text-edit" aria-pressed="false" data-i18n="Modifica i testi">Modifica i testi</button>
      </div>
      <p class="version"><span data-i18n="Versione">Versione</span> __ORPHEUS_VERSION__</p>
    </div>
  </nav>
  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Chiudi il dettaglio" data-i18n-aria="Chiudi il dettaglio">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script src="/static/stili.js"></script>
<script src="/static/en.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
